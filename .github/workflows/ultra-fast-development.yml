name: Ultra and Fast development

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/ultra-fast-development.yml

permissions:
  contents: read

jobs:
  source:
    if: github.repository_id == '1399429101' && github.head_ref == 'feat/ultra-fast-independent-controls' && github.event.pull_request.head.repo.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Export pinned public source without running application code
        env:
          SOURCE_SHA: c08148e647de22486fcde742bf6ef71128984e97
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init --bare "$RUNNER_TEMP/source.git"
          git --git-dir="$RUNNER_TEMP/source.git" fetch --no-tags --no-recurse-submodules --depth=1 https://github.com/Hylouis233/minimax-code.git "$SOURCE_SHA"
          test "$(git --git-dir="$RUNNER_TEMP/source.git" rev-parse FETCH_HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/source-evidence"
          git --git-dir="$RUNNER_TEMP/source.git" archive --format=tar.gz "$SOURCE_SHA" > "$RUNNER_TEMP/source-evidence/source.tar.gz"
          git --git-dir="$RUNNER_TEMP/source.git" ls-tree -rz --full-tree "$SOURCE_SHA" > "$RUNNER_TEMP/source-evidence/tree.bin"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/source-evidence/commit.txt"
          sha256sum "$RUNNER_TEMP/source-evidence/source.tar.gz" > "$RUNNER_TEMP/source-evidence/archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ultra-fast-source-${{ github.run_id }}
          path: ${{ runner.temp }}/source-evidence/
          if-no-files-found: error
          retention-days: 7
